<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1c1424"><title>D+B | Our Little Paradise</title><style>
*{box-sizing:border-box}body{margin:0;background:#15101a;color:#fff7e9;font-family:Georgia,serif}button,input,textarea{font:inherit}button{cursor:pointer}.app{width:100%;max-width:540px;min-height:100dvh;margin:auto;position:relative;background:#1d1721;overflow:hidden}.scene{position:relative;width:100%;aspect-ratio:2/3;background:url('waterfall.jpg') center/cover no-repeat}.clock-mask{position:absolute;left:27%;width:48%;top:55.5%;height:14%;border-radius:24%;background:radial-gradient(ellipse at center,rgba(15,21,27,.98) 10%,rgba(16,24,30,.94) 60%,rgba(16,25,30,.3) 83%,transparent 100%);display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;text-shadow:0 2px 8px #120d14}.clock{font-size:clamp(29px,9vw,52px);color:#ffdb9d;letter-spacing:1px}.date{font-size:clamp(10px,2.9vw,16px);color:#ffe4af;white-space:nowrap}.tiny-heart{color:#ffcfba;font-size:16px;margin-top:5px}.top-title{position:absolute;top:3%;width:100%;text-align:center;color:#fff5db;font-size:clamp(16px,5vw,26px);text-shadow:0 2px 10px #3d2238;letter-spacing:2px}.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:#2b1c2a;padding:10px 6px calc(10px + env(safe-area-inset-bottom));position:sticky;bottom:0;z-index:3}.nav button{border:0;background:transparent;color:#f9dca8;padding:7px 1px;font-family:system-ui;font-size:10px}.nav button.active{background:#594052;border-radius:12px}.nav .symbol{display:block;font-size:21px;margin-bottom:4px}.panel{padding:23px 19px 95px;min-height:50vh;background:linear-gradient(#2a2030,#17121e)}h1{font-size:26px;margin:0 0 9px;color:#ffdda7}p{line-height:1.5}.muted{color:#d7c2ca}.item{background:#ffffff10;border:1px solid #ffffff2b;border-radius:16px;padding:13px;margin:12px 0;overflow-wrap:anywhere}.item img{max-width:100%;border-radius:10px}.action{background:#c98d9d;color:#201420;border:0;border-radius:13px;padding:11px 15px;margin:8px 4px 8px 0;font-weight:bold}.secondary{background:#403044;color:white}.field{display:block;width:100%;background:#fff9ef;color:#241a26;border:0;border-radius:10px;padding:12px;margin:9px 0}.hidden{display:none}.music{width:100%}.back{color:#ffdcab;background:none;border:0;padding:8px 0}small{color:#dec7cb}.welcome{text-align:center;padding:12px;background:#241b28}.welcome strong{color:#ffe1a9}@media(min-width:540px){.app{box-shadow:0 0 35px #0009}.clock{font-size:52px}.date{font-size:16px}}
</style></head><body><div class="app"><main id="content"></main><nav class="nav" id="nav"></nav></div><script>
const sections=[['home','⌂','Home'],['memories','▧','Memories'],['music','♫','Music'],['story','♡','Our Story'],['more','✉','More']];
const $=id=>document.getElementById(id);let current='home';
const get=k=>JSON.parse(localStorage.getItem('db_'+k)||'[]');const save=(k,v)=>localStorage.setItem('db_'+k,JSON.stringify(v));
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function clock(){const d=new Date();const t=$('live-time'),dt=$('live-date');if(t)t.textContent=d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});if(dt)dt.textContent=d.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric',year:'numeric'})}setInterval(clock,1000);
function go(id){current=id;render();window.scrollTo({top:0,behavior:'instant'})}
function render(){const n=$('nav');n.innerHTML=sections.map(([id,ic,txt])=>`<button class="${id===current?'active':''}" onclick="go('${id}')"><span class="symbol">${ic}</span>${txt}</button>`).join('');const c=$('content');
if(current==='home'){c.innerHTML=`<section class="scene"><div class="top-title">OUR LITTLE PARADISE</div><div class="clock-mask"><div class="clock" id="live-time"></div><div class="date" id="live-date"></div><div class="tiny-heart">♡</div></div></section><div class="welcome"><strong>D + B</strong><p>Our favorite place is wherever we're together.</p><small>Made with love, just for Bella.</small></div>`;clock();return}
if(current==='memories'){c.innerHTML=`<section class="panel"><h1>Our Memories 📸</h1><p class="muted">A little scrapbook of us.</p><button class="action" onclick="addPhoto()">+ Add a photo</button><div id="items"></div></section>`;draw('memories');return}
if(current==='music'){c.innerHTML=`<section class="panel"><h1>Our Music ♫</h1><p class="muted">Songs that tell our story.</p><button class="action" onclick="addMusic()">+ Add a song</button><div id="items"></div><small>Audio files stay on this device in this first prototype.</small></section>`;draw('music');return}
if(current==='story'){c.innerHTML=`<section class="panel"><h1>Our Story ♡</h1><p class="muted">The moments that brought us here.</p><button class="action" onclick="addText('story')">+ Add a moment</button><div id="items"></div></section>`;draw('story');return}
if(current==='more'){c.innerHTML=`<section class="panel"><h1>For Bella ✉</h1><p class="muted">Letters and little surprises.</p><button class="action" onclick="addText('letters')">+ Write a letter</button><button class="action secondary" onclick="addText('surprises')">+ Add a surprise</button><h2>Letters</h2><div id="letters"></div><h2>Surprises</h2><div id="surprises"></div><div class="item"><small>Prototype note: items are saved only in this browser on this device. For a gift you can share across phones, we'll add private cloud storage and publishing later.</small></div></section>`;draw('letters');draw('surprises');}}
function draw(k){let target=$(k==='letters'||k==='surprises'?k:'items');if(!target)return;let entries=get(k);target.innerHTML=entries.length?entries.map((e,i)=>`<div class="item"><strong>${esc(e.title)}</strong>${e.date?`<p><small>${esc(e.date)}</small></p>`:''}${e.text?`<p>${esc(e.text)}</p>`:''}${e.photo?`<img src="${e.photo}" alt="Memory photo">`:''}${e.audio?`<audio class="music" controls src="${e.audio}"></audio>`:''}<p><button class="back" onclick="removeItem('${k}',${i})">Remove</button></p></div>`).join(''):'<p class="muted">Your first keepsake goes here. ♡</p>'}
function removeItem(k,i){if(!confirm('Remove this item?'))return;let a=get(k);a.splice(i,1);save(k,a);render()}
function addText(k){let title=prompt(k==='story'?'Name this memory:':k==='letters'?'Letter title:':'Surprise title:');if(!title)return;let text=prompt('Write your message:')||'';let date=k==='story'?(prompt('Date (optional):')||''):'';let a=get(k);a.unshift({title,text,date});save(k,a);render()}
function addPhoto(){let title=prompt('Give this memory a title:');if(!title)return;let f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=()=>{let file=f.files[0];if(!file)return;if(file.size>2500000){alert('For this first prototype, choose a photo smaller than 2.5 MB.');return}let r=new FileReader();r.onload=()=>{try{let a=get('memories');a.unshift({title,photo:r.result});save('memories',a);render()}catch(e){alert('Browser storage is full. A published version will use cloud storage.')}};r.readAsDataURL(file)};f.click()}
function addMusic(){let title=prompt('Song title:');if(!title)return;let f=document.createElement('input');f.type='file';f.accept='audio/*';f.onchange=()=>{let file=f.files[0];if(!file)return;if(file.size>2500000){alert('This prototype only stores small audio clips (under 2.5 MB). Full songs will need cloud storage.');return}let r=new FileReader();r.onload=()=>{try{let a=get('music');a.unshift({title,audio:r.result});save('music',a);render()}catch(e){alert('Not enough browser storage for this song.')}};r.readAsDataURL(file)};f.click()}
render();
</script></body></html>
